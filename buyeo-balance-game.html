<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>부여 워크샵 밸런스 게임</title>
<style>
:root{--bg:#0f0d1a;--panel:#1b1830;--panel2:#262245;--line:#3a3563;--text:#f4f2ff;--dim:#a9a3cf;--a:#ff5c7a;--b:#4d8dff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;overflow:hidden;background:var(--bg)}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a1f5c 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#3b1740 0%,transparent 55%),var(--bg)}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;background:none;touch-action:manipulation}
button:disabled{opacity:.35;pointer-events:none}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 24px 10px;flex-shrink:0}
.top .title{font-weight:800;font-size:21px;flex:1}
.top .pc{color:var(--dim);font-weight:700}
.back{padding:10px 16px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:16px}
.screen{flex:1;overflow:auto;padding:8px 24px 28px;-webkit-overflow-scrolling:touch}
.btn{background:var(--panel2);border:1px solid var(--line);padding:14px 20px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .12s}
.btn.hi{background:linear-gradient(135deg,#6c5cff,#4d8dff);border:none;color:#fff}
.btn.danger{color:#ff8a9c;border-color:#5a2a3a}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.full{width:100%;margin-top:18px}
.primary{background:linear-gradient(135deg,var(--a),#ff8a4c);color:#fff;font-weight:800;font-size:20px;padding:18px 32px;border-radius:18px;box-shadow:0 8px 24px rgba(255,92,122,.35);transition:transform .12s}
.primary.sm{font-size:17px;padding:14px 22px}
.btn:active,.primary:active,.tile:active{transform:scale(.96)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hint{color:var(--dim);font-size:15px;line-height:1.6}
.dimtxt{color:var(--dim);font-size:14px}
.h2{font-size:30px;font-weight:900}
/* home */
.home{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.hero{text-align:center;padding:26px 0 4px}
.badge{display:inline-block;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;color:#ffc93c;font-size:15px}
.hero h1{font-size:clamp(42px,7vw,76px);font-weight:900;margin-top:14px;letter-spacing:-2px;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,#ff5c7a,#ffc93c,#3ddc97,#4d8dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:19px;margin-top:12px}
.count{margin-top:16px;font-size:17px;color:var(--dim)}.count b{color:var(--text);font-size:26px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:168px;transition:transform .12s}
.tile .ic{font-size:40px}.tile .tt{font-size:21px;font-weight:800}.tile .ds{font-size:14px;color:var(--dim);line-height:1.45}
.tile .no{font-size:13px;font-weight:800;color:#ffc93c}
.tile.main{background:linear-gradient(135deg,#ff5c7a,#ff9a3c);border:none}.tile.main .ds,.tile.main .no{color:rgba(255,255,255,.9)}
.flow{color:var(--dim);font-size:14px;text-align:center}
/* respond */
.center-col{max-width:580px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:3vh;text-align:center}
.step-emoji{font-size:56px}.step-emoji.big{font-size:90px;animation:boom .6s}
.big-input{width:100%;font-size:30px;font-weight:800;text-align:center;padding:18px;border-radius:18px;border:2px solid var(--line);background:var(--panel);color:var(--text);outline:none;font-family:inherit}
.big-input:focus{border-color:var(--a)}
.photo-btn{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:16px;background:var(--panel);border:1px dashed var(--line);cursor:pointer;font-weight:700;color:var(--dim);font-size:15px;text-align:left}
.photo-btn img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.ph0{width:64px;height:64px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.qwrap{max-width:1150px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.qmeta{display:flex;justify-content:space-between;color:var(--dim);font-weight:700;font-size:15px}
.part{color:#ffc93c}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.prog div{height:100%;background:linear-gradient(90deg,var(--a),#ffc93c);transition:width .3s}
.qtext{font-size:clamp(26px,3.6vw,42px);font-weight:900;line-height:1.3;letter-spacing:-.5px;text-align:center;margin:8px 0}
.ab{display:flex;gap:16px;align-items:stretch;flex:1}
.card{flex:1;border-radius:26px;padding:26px 26px;display:flex;flex-direction:column;gap:14px;text-align:left;min-height:240px;transition:transform .15s,box-shadow .2s,opacity .2s;color:#fff}
.card.A{background:linear-gradient(160deg,#ff5c7a,#b82a55)}.card.B{background:linear-gradient(160deg,#4d8dff,#2744b8)}
.card .lab{font-size:56px;font-weight:900;opacity:.92;line-height:1}
.card .txt{font-size:clamp(20px,2.4vw,29px);font-weight:800;line-height:1.42}
button.card:active{transform:scale(.98)}
.card.sel{box-shadow:0 0 0 5px #fff,0 12px 40px rgba(0,0,0,.4);transform:scale(1.02)}
.card.dim{opacity:.4}
.vs{align-self:center;font-weight:900;font-size:26px;color:var(--dim);flex-shrink:0}
.qnav{display:flex;justify-content:space-between;gap:12px}
.side{font-size:15px;color:rgba(255,255,255,.85);font-weight:700;margin-top:auto}
.tally{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.22);border-radius:16px;padding:8px;align-self:flex-start}
.tally button{width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.22);font-size:28px;font-weight:800}
.tally span{font-size:34px;font-weight:900;min-width:78px;text-align:center}.tally small{font-size:16px;margin-left:2px}
.pbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.pbar .btn{font-size:18px;padding:16px 22px}
@media (orientation:portrait){.ab{flex-direction:column}.vs{margin:-4px 0}.card{min-height:170px}}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(8,6,20,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .2s}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:28px;max-width:660px;width:100%;max-height:92vh;overflow:auto;animation:rise .25s}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(20px) scale(.97);opacity:0}}
@keyframes boom{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.slot{font-size:clamp(46px,8vw,90px);font-weight:900;text-align:center;padding:26px 0 10px;min-height:1.6em}
.slot.done{animation:boom .5s;background:linear-gradient(90deg,#ffc93c,#ff5c7a);-webkit-background-clip:text;background-clip:text;color:transparent}
.pick-q{text-align:center;font-size:26px;font-weight:800;margin-top:6px}
.cf{text-align:center}.cf p{font-size:19px;line-height:1.6}
.mh{font-size:24px;font-weight:900;margin-bottom:6px}
.sbar{display:flex;height:48px;border-radius:14px;overflow:hidden;margin:16px 0;font-weight:900;font-size:18px}
.sbar div{display:flex;align-items:center;justify-content:center;transition:width .6s}
.sbar .sa{background:var(--a)}.sbar .sb{background:var(--b);flex:1}
.scols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scols>div{display:flex;flex-direction:column;gap:8px}
.sh{font-weight:900;font-size:20px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);background:var(--panel2);border:1px solid var(--line);padding:14px 24px;border-radius:16px;font-weight:800;font-size:18px;z-index:80;transition:transform .35s cubic-bezier(.3,1.4,.5,1);box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
/* avatars & chips */
.av{width:40px;height:40px;border-radius:50%;background:var(--c);color:#16132a;font-weight:900;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:14px;border:2px solid #fff}
.av img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--panel2);font-weight:700;font-size:15px;margin:3px}
.chip .av{width:28px;height:28px;font-size:11px;border-width:1.5px}
/* map */
.mapscr{display:flex;flex-direction:column}
.map-layout{display:flex;gap:18px;flex:1;min-height:0}
.map-main{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.map-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cnt{background:rgba(0,0,0,.25);padding:2px 10px;border-radius:99px;margin-left:6px;font-size:15px}
.map-box{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px}
.map-box svg{width:100%;height:100%;display:block}
.pp{cursor:pointer}
.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.legend{width:290px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.tcard{border-radius:18px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);text-align:left;width:100%}
.th{display:flex;align-items:center;gap:10px}.te{font-size:30px}.tn{font-weight:900;font-size:18px;color:var(--c)}.ts{font-size:13px;color:var(--dim)}
.tc{margin-left:auto;font-size:28px;font-weight:900}
.tchips{margin-top:8px;font-size:14px;color:var(--text);line-height:1.6}
@media (orientation:portrait){.mapscr{display:block}.map-layout{flex-direction:column}.map-box{aspect-ratio:1/1;flex:none}.legend{width:100%;display:grid;grid-template-columns:1fr 1fr}}
/* person card */
.pcard{text-align:center}.pav{display:flex;justify-content:center}
.pname{font-size:32px;font-weight:900;margin-top:10px}
.ptype{font-size:22px;font-weight:800;color:var(--c);margin:4px 0 18px}.ptype small{color:var(--dim);font-size:15px}
.axb{margin:14px 0;text-align:left}.axl{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.axt{height:14px;background:linear-gradient(90deg,#3a3563,#262245 50%,#3a3563);border-radius:99px;position:relative}
.axt:after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--dim)}
.axm{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid #fff;transform:translate(-50%,-50%)}
.axe{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:6px}
.pinfo{text-align:left;background:var(--panel2);border-radius:14px;padding:12px 14px;margin-top:10px;line-height:1.55}.pinfo b{color:var(--c);margin-right:6px}
/* chem */
.chem-wrap{max-width:1100px;margin:0 auto}
.chem-top{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.pairsel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{font-size:18px;padding:13px;border-radius:14px;background:var(--panel);color:var(--text);border:1px solid var(--line);font-family:inherit;font-weight:700;min-width:150px}
.sec{font-size:22px;margin-bottom:12px}.sec small{font-size:14px;color:var(--dim);font-weight:600;margin-left:6px}
.cgroup{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px;margin-bottom:14px;border-top:5px solid var(--cc)}
.cgroup h3{font-size:22px;color:var(--cc)}.cgroup .tg{color:var(--dim);margin:4px 0 8px;line-height:1.5}
.crow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px dashed var(--line)}
.cside{flex:1;min-width:200px}.cside .lbl{font-size:14px;color:var(--dim);font-weight:800;margin-bottom:4px}
.cx{font-size:28px;font-weight:900;color:var(--dim)}
.chemcard{text-align:center}.ce{font-size:66px;animation:boom .6s}.ct{font-size:34px;font-weight:900;color:var(--cc)}
.ctag{color:var(--dim);font-size:17px;margin-top:4px}
.pair{display:flex;justify-content:center;align-items:center;gap:20px;margin:18px 0}
.pm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:19px}.pm small{font-size:13px}
.line{background:var(--panel2);border-radius:14px;padding:14px;font-weight:800;font-size:18px;line-height:1.5;border-left:5px solid var(--cc)}
.cdesc{text-align:left;color:var(--dim);line-height:1.65;margin-top:10px;font-size:15px}
.match{margin:18px 0 6px;font-weight:700;font-size:17px}.match b{color:var(--cc);font-size:22px}
.kt{font-weight:800;margin:14px 0 6px;text-align:left}
table.keys{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
table.keys th,table.keys td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.keys th{color:var(--dim);font-size:13px}.kq{font-weight:800}
.ch{display:inline-block;width:22px;height:22px;border-radius:6px;text-align:center;line-height:22px;font-weight:900;font-size:12px;margin-right:4px;color:#fff}
.ch.A{background:var(--a)}.ch.B{background:var(--b)}
/* manage */
.mg{max-width:900px;margin:0 auto}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.prow{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.pn{font-weight:800;font-size:18px;min-width:90px}.pt{font-weight:800;flex:1}.psc{color:var(--dim);font-size:14px}
.note{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--dim);line-height:1.7;font-size:14px}
.empty{text-align:center;padding-top:10vh}
</style>
</head>
<body>
<div id="app"><div class="empty"><div class="step-emoji">⏳</div><p class="hint">불러오는 중...</p></div></div>
<div id="ov" class="ov hidden" onclick="if(event.target===this)closeM()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
const PARTS=['유쾌한 야근 vs 출근','소통 & 협업 스타일','워크샵 & 팀 문화 (부여 맞춤형)','능력 & 평가'];
const Q=[
{p:0,k:'월급 vs 칼퇴',t:'평생 하나의 업무 조건으로 일해야 한다면?',a:'매일 칼퇴근하지만 월급 10% 삭감',b:'매일 2시간 야근하지만 월급 20% 인상',sa:'칼퇴·월급 삭감',sb:'야근·월급 인상',ax:'x',va:-1},
{p:0,k:'출퇴근 환경',t:'더 견디기 힘든 출퇴근 상황은?',a:'지옥철/만차 버스로 왕복 3시간 출퇴근',b:'회사 바로 앞 자취방이지만, 매일 회사 동료와 마주치는 삶',sa:'지옥철 왕복 3시간',sb:'회사 앞 자취',ax:'y',va:1},
{p:0,k:'팀장 스타일',t:'더 선호하는 업무 스타일은?',a:'피드백 꼼꼼하고 엄격하지만 일 진짜 잘하는 팀장',b:'성격 너무 좋고 천사인데 일 처리가 느려서 내가 다 뒤집어쓰는 팀장',sa:'엄격한 능력자 팀장',sb:'천사 팀장',ax:'x',va:1},
{p:1,k:'힘든 팀 스타일',t:'팀 프로젝트 진행 시 더 고통스러운 상황은?',a:'지시 사항이 매시간 바뀌는 갈팡질팡 팀',b:'아무 말도 안 하고 내 말에 "네, 알아서 하세요"만 하는 무영혼 팀',sa:'갈팡질팡 팀',sb:'무영혼 팀',ax:'x',va:-1},
{p:1,k:'메신저 스타일',t:'메신저 및 커뮤니케이션 스타일은?',a:'용건만 간단히 단답형 (예: "네", "확인했습니다")',b:'텍스트 뒤에 ㅋㅋㅋ와 이모티콘 5개 필수 첨부',sa:'단답형',sb:'ㅋㅋㅋ+이모티콘',ax:'y',va:-1},
{p:1,k:'무서운 알림',t:'더 무서운 메신저 알림은?',a:'금요일 저녁 6시 01분에 온 상사의 "주말 잘 보내고, 월요일에 이따 봅시다"',b:'월요일 아침 8시 50분에 온 "OO씨, 잠시 회의실로"',sa:'금요일 저녁 상사 연락',sb:'월요일 아침 회의실 호출',ax:'y',va:-1},
{p:2,k:'차 안 분위기',t:'워크샵 이동 차 안에서 내가 원하는 분위기는?',a:'끊임없는 수다와 신나는 음악 (DJ 역할 자처)',b:'조용히 이어폰 끼고 창밖 보며 가기 (수면 모드)',sa:'DJ 자처',sb:'수면 모드',ax:'y',va:1},
{p:2,k:'회식 자리',t:'워크샵 저녁 회식 자리에서 더 선호하는 상황은?',a:'고기 계속 구워주는 대신 회사 얘기만 2시간 하는 상사 옆자리',b:'고기는 내가 다 구워야 하지만 꿀잼 드립만 치는 동기들 옆자리',sa:'상사 옆자리',sb:'꿀잼 동기들 옆',ax:'y',va:-1},
{p:2,k:'워크샵 포상',t:'이번 워크샵에서 더 탐나는 포상 상품은?',a:'팀 전체 회식비 30만 원 지원',b:'팀원 전원 반차(0.5일) 휴가권',sa:'회식비 30만 원',sb:'전원 반차',ax:'x',va:-1},
{p:3,k:'탐나는 평가',t:'더 받고 싶은 평가 표현은?',a:'"OO씨는 없으면 우리 팀 안 돌아가" (대체 불가능한 일꾼)',b:'"OO씨는 일도 잘하는데 진짜 재미있어" (분위기 메이커)',sa:'대체 불가 일꾼',sb:'재미있는 사람',ax:'y',va:-1},

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>(v>0?'+':'')+v;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function score(ans){let x=0,y=0;Q.forEach((q,i)=>{const v=ans[i]==='A'?q.va:-q.va;if(q.ax==='x')x+=v;else y+=v});return{x,y}}
function quad(p){const {x,y}=score(p.answers);const sx=x!==0?Math.sign(x):(p.answers[11]==='A'?1:-1);const sy=y!==0?Math.sign(y):(p.answers[6]==='A'?1:-1);return sx>0?(sy>0?1:4):(sy>0?2:3)}
const byId=id=>people.find(p=>p.id===id);
function short(n){if(/^[가-힣]+$/.test(n)){return n.length===3?n.slice(1):n.length>=4?n.slice(-2):n}return n.slice(0,2).toUpperCase()}
function avatar(p,size){const s=size?`width:${size}px;height:${size}px;font-size:${Math.round(size*.34)}px;border-width:3px;`:'';return `<span class="av" style="--c:${T[quad(p)].hex};${s}">${photos[p.id]?`<img src="${photos[p.id]}">`:esc(short(p.name))}</span>`}
function chips(list){return list.map(p=>`<span class="chip">${avatar(p)}${esc(p.name)}</span>`).join('')||'<span class="dimtxt">아직 없음</span>'}

/* storage */
const LS={async get(k){const v=localStorage.getItem(k);return v==null?null:{value:v}},async set(k,v){localStorage.setItem(k,v)},async delete(k){localStorage.removeItem(k)}};
const store=(()=>{if(window.storage&&typeof window.storage.get==='function')return window.storage;try{const t='__wk_t';localStorage.setItem(t,'1');localStorage.removeItem(t);return LS}catch(e){return null}})();
const hasStore=()=>!!store;
async function load(){if(!hasStore())return;try{const r=await store.get('wk-people',false);if(r&&r.value)people=JSON.parse(r.value)}catch(e){}
await Promise.all(people.filter(p=>p.ph).map(async p=>{try{const r=await store.get('wk-photo:'+p.id,false);if(r&&r.value)photos[p.id]=r.value}catch(e){}}))}
async function savePeople(){if(!hasStore())return;try{await store.set('wk-people',JSON.stringify(people),false)}catch(e){toast('⚠️ 저장 실패 — 창을 닫으면 데이터가 사라질 수 있어요')}}
async function savePhoto(id,d){if(!hasStore())return;try{await store.set('wk-photo:'+id,d,false)}catch(e){}}
async function delPhoto(id){if(!hasStore())return;try{await store.delete('wk-photo:'+id,false)}catch(e){}}

/* ui helpers */
let tt,slotTimer;
function toast(h,ms=2300){const t=$('#toast');t.innerHTML=h;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms)}
function modal(h){$('#mbox').innerHTML=h;$('#ov').classList.remove('hidden')}

function slot(frame,final){clearTimeout(slotTimer);modal(`<div class="slot" id="slot"></div><div id="slotx"></div>`);let d=45,n=0;const step=()=>{const el=$('#slot');if(!el||$('#ov').classList.contains('hidden'))return;el.innerHTML=frame();n++;d*=1.085;if(n<20)slotTimer=setTimeout(step,d);else final()};step()}
function topBar(title,back){return `<div class="top"><button class="back" onclick="${back||"go('home')"}">← 홈</button><div class="title">${title}</div><div class="pc">👥 ${people.length}명</div></div>`}
function go(s){closeM();S.screen=s;if(s==='respond')R={step:'name',name:'',photo:null,answers:[],i:0,replaceId:null};if(s==='map')syncMap();render()}

function render(){let h='';switch(S.screen){case'home':h=vHome();break;case'respond':h=vRespond();break;case'play':h=vPlay();break;case'map':h=vMap();break;case'chem':h=vChem();break;case'manage':h=vManage();break}
$('#app').innerHTML=h;const nm=$('#nm');if(nm)nm.value=R.name}

function vRespond(){

<input id="nm" class="big-input" placeholder="예: 김부여" maxlength="12" autocomplete="off" oninput="R.name=this.value" onkeydown="if(event.key==='Enter'){this.blur();startQ()}">

if(R.step==='q'){const q=Q[R.i],sel=R.answers[R.i];const cls=k=>sel?(sel===k?'sel':'dim'):'';

<div class="qnav"><button class="btn" onclick="prevQ()" ${R.i===0?'disabled':''}>← 이전 문항</button><button class="btn" onclick="quitR()">그만두기</button></div></div></div>`}

function onPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);const cv=document.createElement('canvas');cv.width=cv.height=160;cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);R.photo=cv.toDataURL('image/jpeg',.75);render()};img.src=rd.result};rd.readAsDataURL(f)}
function startQ(){const n=(R.name||'').trim();if(!n){toast('이름을 입력해 주세요 ✍️');return}R.name=n;const ex=people.find(p=>p.name===n);
if(ex){confirmM(`<b>'${esc(n)}'</b> 이름으로 이미 응답했어요.<br>새 응답으로 덮어쓸까요?`,'덮어쓰기',()=>{R.replaceId=ex.id;R.step='q';R.i=0;render()});return}R.step='q';R.i=0;render()}
function answer(v){if(busy)return;busy=true;R.answers[R.i]=v;render();setTimeout(()=>{busy=false;if(R.i<11){R.i++;render()}else finishR()},260)}
function prevQ(){if(R.i>0){R.i--;render()}}

function finishR(){const id=R.replaceId||uid();const old=byId(id);const p={id,name:R.name,answers:R.answers.slice(),ts:Date.now(),ph:!!(R.photo||(old&&old.ph))};
if(old)people[people.indexOf(old)]=p;else people.push(p);if(R.photo){photos[id]=R.photo;savePhoto(id,R.photo)}R.step='done';render();savePeople()}

return topBar('🎤 밸런스 게임 진행')+`<div class="screen"><div class="qwrap">

function pick(from){const pool=people.filter(p=>!from||p.answers[P.i]===from);
if(!pool.length){toast(people.length?'해당 선택을 한 사람이 없어요':'먼저 개인 응답을 받아야 지목할 수 있어요 🙂');return}
slot(()=>esc(rnd(pool).name),()=>{const p=rnd(pool),c=p.answers[P.i],q=Q[P.i];const el=$('#slot');el.innerHTML=esc(p.name);el.classList.add('done');
$('#slotx').innerHTML=`<div class="pick-q">🎤 왜 <span style="color:${c==='A'?'var(--a)':'var(--b)'}">${c}</span>를 고르셨나요?</div><p class="hint" style="text-align:center;margin-top:6px">${esc(c==='A'?q.a:q.b)}</p><div class="row"><button class="btn hi" onclick="pick(${from?`'${from}'`:''})">🎯 다시 뽑기</button><button class="btn" onclick="closeM()">닫기</button></div>`})}
function showStats(){const q=Q[P.i];const A=people.filter(p=>p.answers[P.i]==='A'),B=people.filter(p=>p.answers[P.i]==='B');const pa=Math.round(A.length/people.length*100);
modal(`<h3 class="mh">📊 사전 응답 결과 · Q${P.i+1}</h3><p class="hint">${esc(q.t)}</p>
<div class="sbar"><div class="sa" style="width:${pa}%">${pa>=12?'A '+pa+'%':''}</div><div class="sb">${100-pa>=12?'B '+(100-pa)+'%':''}</div></div>
<div class="scols"><div><div class="sh" style="color:var(--a)">A · ${A.length}명</div><div>${chips(A)}</div><button class="btn" onclick="closeM();pick('A')" ${A.length?'':'disabled'}>A 선택자 중 지목</button></div>
<div><div class="sh" style="color:var(--b)">B · ${B.length}명</div><div>${chips(B)}</div><button class="btn" onclick="closeM();pick('B')" ${B.length?'':'disabled'}>B 선택자 중 지목</button></div></div>
<button class="btn full" onclick="closeM()">닫기</button>`)}

/* MAP */
function syncMap(){const ids=people.map(p=>p.id);M.order=M.order.filter(id=>ids.includes(id));M.order=M.order.concat(shuffle(ids.filter(id=>!M.order.includes(id))));M.n=Math.min(M.n,M.order.length)}
function ring(n){if(n===1)return[[0,0]];if(n<=7){const r=n<=3?24:32;return Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[Math.cos(a)*r,Math.sin(a)*r]})}
const out=[[0,0]];let left=n-1,k=1;while(left>0){const cap=k*6,m=Math.min(cap,left),r=k*34;for(let i=0;i<m;i++){const a=-Math.PI/2+i*2*Math.PI/m;out.push([Math.cos(a)*r,Math.sin(a)*r])}left-=m;k++}return out}
function mapSVG(vis){const U=55,C=400,X=v=>C+v*U,Y=v=>C-v*U;
let s=`<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"><defs>${vis.filter(p=>photos[p.id]).map(p=>`<clipPath id="cp${p.id}"><circle r="19"/></clipPath>`).join('')}</defs>`;
[[2,0,0],[1,400,0],[3,0,400],[4,400,400]].forEach(([k,x,y])=>s+=`<rect x="${x}" y="${y}" width="400" height="400" fill="${T[k].hex}" opacity=".09"/>`);
for(let i=-6;i<=6;i+=2)for(let j=-6;j<=6;j+=2)s+=`<circle cx="${X(i)}" cy="${Y(j)}" r="2.5" fill="#5b5690"/>`;
s+=`<line x1="18" y1="400" x2="782" y2="400" stroke="#6b66a3" stroke-width="2"/><line x1="400" y1="18" x2="400" y2="782" stroke="#6b66a3" stroke-width="2"/>`;
const lab=(x,y,t,a)=>`<text x="${x}" y="${y}" font-size="15" font-weight="800" fill="#a9a3cf" text-anchor="${a}">${t}</text>`;
s+=lab(782,388,'원칙·과업 중심 ▶','end')+lab(18,388,'◀ 유연·관계 중심','start')+lab(410,32,'▲ 적극·표현형','start')+lab(410,780,'▼ 신중·독립형','start');
[[2,26,58,'start'],[1,774,58,'end'],[3,26,730,'start'],[4,774,730,'end']].forEach(([k,x,y,a])=>{const n=vis.filter(p=>quad(p)===k).length;
s+=`<text x="${x}" y="${y}" font-size="26" font-weight="900" fill="${T[k].hex}" text-anchor="${a}">${T[k].emo} ${T[k].name}</text><text x="${x}" y="${y+24}" font-size="15" font-weight="700" fill="#a9a3cf" text-anchor="${a}">${T[k].sub} · ${n}명</text>`});
const g={};vis.forEach(p=>{const sc=score(p.answers);const key=sc.x+','+sc.y;(g[key]=g[key]||[]).push(p)});
const items=[];Object.entries(g).forEach(([key,list])=>{const [sx,sy]=key.split(',').map(Number);const pos=ring(list.length);list.forEach((p,i)=>items.push({p,x:X(sx)+pos[i][0],y:Y(sy)+pos[i][1],label:list.length<=4||!!photos[p.id]}))});
items.sort((a,b)=>(a.p.id===M.last)-(b.p.id===M.last));
items.forEach(({p,x,y,label})=>{const hx=T[quad(p)].hex;const ph=photos[p.id];
s+=`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})" class="pp" onclick="personCard('${p.id}')"><g class="${M.last===p.id?'pop':''}">${M.last===p.id?`<circle r="30" fill="none" stroke="${hx}" stroke-width="3" opacity=".7"/>`:''}<circle r="21" fill="${hx}" stroke="#fff" stroke-width="3"/>${ph?`<image href="${ph}" x="-19" y="-19" width="38" height="38" clip-path="url(#cp${p.id})" preserveAspectRatio="xMidYMid slice"/>`:`<text y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#16132a">${esc(short(p.name))}</text>`}${label?`<text y="39" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" stroke="#0f0d1a" stroke-width="4" paint-order="stroke">${esc(p.name)}</text>`:''}</g></g>`});
if(!vis.length)s+=`<rect x="190" y="430" width="420" height="56" rx="16" fill="#262245" stroke="#3a3563"/><text x="400" y="465" text-anchor="middle" font-size="18" font-weight="800" fill="#f4f2ff">❓ 위 버튼을 눌러 한 명씩 공개하세요</text>`;
return s+'</svg>'}
function vMap(){if(!people.length)return topBar('🗺️ 우리 팀 성향 지도')+`<div class="screen"><div class="center-col"><div class="step-emoji">🗺️</div><h2 class="h2">아직 응답이 없어요</h2><p class="hint">개인 응답을 먼저 받아 주세요.</p><button class="primary" onclick="go('respond')">✍️ 개인 응답 시작</button></div></div>`;
const shown=new Set(M.order.slice(0,M.n));const vis=people.filter(p=>shown.has(p.id));
return topBar('🗺️ 우리 팀 성향 지도')+`<div class="screen mapscr"><div class="map-layout"><div class="map-main"><div class="map-ctrl"><button class="primary sm" onclick="revealNext()" ${M.n>=M.order.length?'disabled':''}>🎲 한 명씩 공개<span class="cnt">${M.n}/${M.order.length}</span></button><button class="btn" onclick="revealAll()">전체 공개</button><button class="btn" onclick="hideAll()">숨기기</button></div>
<div class="map-box">${mapSVG(vis)}</div></div><div class="legend">${[1,2,3,4].map(k=>legendCard(k,vis)).join('')}</div></div></div>`}
function legendCard(k,vis){const mem=vis.filter(p=>quad(p)===k),t=T[k];return `<button class="tcard" style="--c:${t.hex}" onclick="typeCard(${k})"><div class="th"><span class="te">${t.emo}</span><div><div class="tn">${t.name}</div><div class="ts">${k}분면 · ${t.sub}</div></div><div class="tc">${mem.length}</div></div><div class="tchips">${mem.map(p=>esc(p.name)).join(' · ')||'<span class="dimtxt">—</span>'}</div></button>`}
function revealNext(){if(M.n>=M.order.length)return;M.n++;M.last=M.order[M.n-1];render();const p=byId(M.last),t=T[quad(p)];toast(`<span style="color:${t.hex}">${t.emo}</span> <b>${esc(p.name)}</b> → <span style="color:${t.hex}">${t.name}</span>`,2600)}
function revealAll(){M.n=M.order.length;M.last=null;render()}
function hideAll(){M.n=0;M.last=null;render()}
function typeCard(k){const t=T[k];const shown=new Set(M.order.slice(0,M.n));const mem=people.filter(p=>shown.has(p.id)&&quad(p)===k);
modal(`<div class="pcard" style="--c:${t.hex}"><div class="ce">${t.emo}</div><div class="pname" style="color:${t.hex}">${t.name}</div><div class="ptype"><small>${k}분면 · ${t.sub}</small></div><div class="pinfo"><b>핵심</b>${t.core}</div><div class="pinfo"><b>특징</b>${t.desc}</div><div class="pinfo"><b>추천 역할</b>${t.role}</div><div style="margin-top:14px">${chips(mem)}</div><button class="btn full" onclick="closeM()">닫기</button></div>`)}
function axisBar(label,v,l,r){return `<div class="axb"><div class="axl"><span>${label}</span><b>${fmt(v)}점</b></div><div class="axt"><div class="axm" style="left:${(v+6)/12*100}%"></div></div><div class="axe"><span>◀ ${l}</span><span>${r} ▶</span></div></div>`}
function personCard(id){const p=byId(id);if(!p)return;const sc=score(p.answers),k=quad(p),t=T[k];
modal(`<div class="pcard" style="--c:${t.hex}"><div class="pav">${avatar(p,100)}</div><div class="pname">${esc(p.name)}</div><div class="ptype">${t.emo} ${t.name} <small>${t.sub}</small></div>
${axisBar('X축 · 업무 성향',sc.x,'유연·관계','원칙·과업')}${axisBar('Y축 · 소통 성향',sc.y,'신중·독립','적극·표현')}
<div class="pinfo"><b>특징</b>${t.desc}</div><div class="pinfo"><b>추천 역할</b>${t.role}</div>
<div class="row"><button class="btn hi" onclick="CH.a='${id}';CH.b='';go('chem')">💞 케미 찾기</button><button class="btn" onclick="closeM()">닫기</button></div></div>`)}

/* CHEM */
function chemKey(a,b){const k=[a,b].sort().join('');return k==='12'?'combo':(k==='13'||k==='24')?'bomb':k==='34'?'zone':'none'}
function vChem(){if(people.length<2)return topBar('💞 케미 매칭')+`<div class="screen"><div class="center-col"><div class="step-emoji">💞</div><h2 class="h2">응답이 2명 이상 필요해요</h2><button class="primary" onclick="go('respond')">✍️ 개인 응답 시작</button></div></div>`;
const opts=sel=>`<option value="">선택</option>`+people.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
return topBar('💞 케미 매칭')+`<div class="screen"><div class="chem-wrap"><div class="chem-top"><button class="primary" onclick="randomChem()">🎰 랜덤 케미 뽑기</button>
<div class="pairsel"><select onchange="CH.a=this.value">${opts(CH.a)}</select><span class="cx">💞</span><select onchange="CH.b=this.value">${opts(CH.b)}</select><button class="btn hi" onclick="checkChem()">케미 확인</button></div></div>
<h3 class="sec">📋 케미 지도 <small>분면 조합별 자동 매칭</small></h3>${cgroup('combo',[[1,2]])}${cgroup('bomb',[[1,3],[4,2]])}${cgroup('zone',[[3,4]])}</div></div>`}
function cgroup(key,pairs){const c=CHEM[key],bq=k=>people.filter(p=>quad(p)===k);return `<div class="cgroup" style="--cc:${c.c}"><h3>${c.emo} ${c.title}</h3><div class="tg">"${c.tag}" — ${c.line}</div>${pairs.map(([a,b])=>`<div class="crow"><div class="cside"><div class="lbl">${T[a].emo} ${T[a].name}</div>${chips(bq(a))}</div><div class="cx">×</div><div class="cside"><div class="lbl">${T[b].emo} ${T[b].name}</div>${chips(bq(b))}</div></div>`).join('')}</div>`}
function checkChem(){if(!CH.a||!CH.b){toast('두 사람을 골라주세요');return}if(CH.a===CH.b){toast('서로 다른 두 사람을 골라주세요');return}showChem(CH.a,CH.b)}
function randomChem(){if(people.length<2){toast('응답이 2명 이상 필요해요');return}const two=()=>shuffle(people).slice(0,2);
slot(()=>{const [a,b]=two();return `<span style="font-size:.6em">${esc(a.name)} × ${esc(b.name)}</span>`},()=>{const [a,b]=two();showChem(a.id,b.id)})}
function pm(p){const t=T[quad(p)];return `<div class="pm">${avatar(p,78)}<div>${esc(p.name)}</div><small style="color:${t.hex}">${t.emo} ${t.name}</small></div>`}
function showChem(a,b){const p1=byId(a),p2=byId(b);if(!p1||!p2)return;const k1=quad(p1),k2=quad(p2),key=chemKey(k1,k2);
let c=CHEM[key];if(!c)c=k1===k2?{emo:'🪞',title:'닮은꼴 케미',tag:'같은 분면에서 만난 사이',line:`둘 다 ${T[k1].name}! 생각하는 방식이 비슷해서 말이 잘 통하는 사이`,desc:[],keys:null,c:T[k1].hex}:{emo:'🤝',title:'알아가는 사이',tag:'정해진 공식이 없는 조합',line:'특별한 케미 공식은 없지만, 오늘 워크샵에서 알아가면 되는 사이',desc:[],keys:null,c:'#b9a8ff'};
const same=p1.answers.filter((v,i)=>v===p2.answers[i]).length;let keys=c.keys;
if(!keys){const diff=Q.map((_,i)=>i).filter(i=>p1.answers[i]!==p2.answers[i]);keys=(diff.length?diff:[0,1,2]).slice(0,3)}
const rows=keys.map(i=>{const q=Q[i],v1=p1.answers[i],v2=p2.answers[i];return `<tr><td class="kq">Q${i+1} ${q.k}</td><td><span class="ch ${v1}">${v1}</span>${v1==='A'?q.sa:q.sb}</td><td><span class="ch ${v2}">${v2}</span>${v2==='A'?q.sa:q.sb}</td><td>${v1===v2?'🤝':'⚡'}</td></tr>`}).join('');
modal(`<div class="chemcard" style="--cc:${c.c}"><div class="ce">${c.emo}</div><div class="ct">${c.title}</div><div class="ctag">"${c.tag}"</div>
<div class="pair">${pm(p1)}<div class="cx">×</div>${pm(p2)}</div><div class="line">${c.line}</div>${c.desc.map(d=>`<p class="cdesc">${d}</p>`).join('')}
<div class="match">12문항 중 <b>${same}개</b> 같은 선택 · 싱크로율 ${Math.round(same/12*100)}%${same===12?' 🪞 완벽한 도플갱어!':''}</div>
<div class="kt">${c.keys?'🔑 핵심 질문 비교':'👀 서로 다르게 고른 질문'}</div>
<table class="keys"><tr><th>질문</th><th>${esc(p1.name)}</th><th>${esc(p2.name)}</th><th></th></tr>${rows}</table>
<div class="row"><button class="btn hi" onclick="randomChem()">🎰 랜덤 한 번 더</button><button class="btn" onclick="closeM()">닫기</button></div></div>`)}

/* MANAGE */
function vManage(){return topBar('⚙️ 참가자 관리')+`<div class="screen"><div class="mg"><p class="hint">⚠️ 이 화면에는 유형이 모두 보이니 발표 전에는 참가자에게 보여주지 마세요.</p>
<div class="row" style="justify-content:flex-start"><button class="btn" onclick="addSample()">🧪 샘플 10명 추가 (테스트용)</button><button class="btn danger" onclick="clearAll()">🗑️ 전체 삭제</button></div>
${people.length?`<div class="plist">${people.map(p=>{const sc=score(p.answers),t=T[quad(p)];return `<div class="prow">${avatar(p)}<div class="pn">${esc(p.name)}</div><div class="pt" style="color:${t.hex}">${t.emo} ${t.name}</div><div class="psc">X ${fmt(sc.x)} · Y ${fmt(sc.y)}</div><button class="btn sm danger" onclick="delP('${p.id}')">삭제</button></div>`}).join('')}</div>`:'<p class="hint" style="margin-top:18px">아직 응답한 사람이 없어요.</p>'}
<div class="note">📌 <b>점수 규칙</b><br>· X축(업무): Q1·Q3·Q4·Q9·Q11·Q12 / Y축(소통): Q2·Q5·Q6·Q7·Q8·Q10 — 각 ±1점, 범위 -6 ~ +6<br>· 점수가 0점(동점)이면 X축은 Q12(A=원칙·과업), Y축은 Q7(A=적극·표현) 선택으로 분면을 정해요<br>· 응답은 이 기기에 자동 저장돼요</div></div></div>`}
function addSample(){const names=['김부여','이백제','박정림','최궁남','정낙화','강부소','조사비','윤연꽃','장성왕','한계백'].filter(n=>!people.some(p=>p.name===n));
names.forEach(n=>people.push({id:uid(),name:n,answers:Q.map(()=>Math.random()<.5?'A':'B'),ts:Date.now(),ph:false}));savePeople();render();toast(`🧪 샘플 ${names.length}명 추가`)}
function delP(id){const p=byId(id);confirmM(`<b>${esc(p.name)}</b>님의 응답을 삭제할까요?`,'삭제',()=>{people=people.filter(x=>x.id!==id);if(photos[id]){delete photos[id];delPhoto(id)}savePeople();render()},true)}
function clearAll(){confirmM('모든 응답을 삭제할까요?<br><small class="hint">되돌릴 수 없어요.</small>','전체 삭제',()=>{people.forEach(p=>{if(p.ph)delPhoto(p.id)});people=[];photos={};M.order=[];M.n=0;M.last=null;P.t={};P.i=0;savePeople();render();toast('🗑️ 전체 삭제 완료')},true)}

load().then(render).catch(render);
</script>
</body>
</html>
